server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # installable app: the manifest needs its proper type
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";   # always check for a newer version
    }

    # Vibe Bridge relay: long-lived WebSockets to the helper (a bridge pushes bar data, pages listen)
    location ^~ /api/bridge/ {
        resolver 127.0.0.11 valid=30s;
        set $helper helper:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$helper;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
    }

    # Server helper (the "helper" service in docker-compose.yml): Spicy Lyrics proxy, Canvas lookups, per-device preferences.
    # Only `tailscale serve` can reach this nginx (port bound to 127.0.0.1), so its X-Forwarded-For
    # (the visiting device's Tailscale IP) can be trusted.
    location ~ ^/(api|canvas-api)/ {
        resolver 127.0.0.11 valid=30s;          # Docker DNS; lets nginx start even if the helper is down
        set $helper helper:8080;
        rewrite ^/(api|canvas-api)/(.*)$ /$2 break;
        proxy_pass http://$helper;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 90s;
        client_max_body_size 256k;
    }
}
