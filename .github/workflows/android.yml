# Builds the Android app (android/) and publishes the APK on the Releases page when a tag like android-v1.0.0 is
# pushed. Every change to android/ is test-built too; it can also be started by hand from the Actions tab.
name: Build Android app
on:
  push:
    tags: ["android-v*"]
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Release key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/vv.p12"; echo "VV_KEYSTORE=$RUNNER_TEMP/vv.p12" >> "$GITHUB_ENV"; else echo "No release key set: signing with a debug key."; fi
      - name: Build
        env:
          VV_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VV_VERSION_CODE: ${{ github.run_number }}
        run: |
          case "$GITHUB_REF_NAME" in android-v*) export VV_VERSION_NAME="${GITHUB_REF_NAME#android-v}";; *) export VV_VERSION_NAME="0.0.$GITHUB_RUN_NUMBER-dev";; esac
          gradle -p android assembleRelease --no-daemon --stacktrace
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/vibe-visualizer-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-visualizer-android
          path: out/vibe-visualizer-android.apk
      - if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vibe Visualizer for Android ${{ github.ref_name }}
          body: |
            Vibe Visualizer on your Android phone or tablet (Android 8 or newer). It opens your Vibe Visualizer server,
            so keep Tailscale connected on the phone, and it has Vibe Bridge built in: the bars follow what the phone
            plays, the Spotify app included.
            Download the APK on the phone, open it and allow installing from your browser. See the README's
            "Android app" section.
          files: out/vibe-visualizer-android.apk
