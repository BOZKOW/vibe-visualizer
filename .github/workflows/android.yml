# Builds the Android app (android/) and publishes the APK on the Releases page when a tag like android-v1.0.0 is
# pushed. Every change to android/ is test-built too; it can also be started by hand from the Actions tab.
name: Build Android app
on:
  push:
    tags: ["android-v*"]
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the history since the last app release, for its notes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Release key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/vv.p12"; echo "VV_KEYSTORE=$RUNNER_TEMP/vv.p12" >> "$GITHUB_ENV"; else echo "No release key set: signing with a debug key."; fi
      - name: Build
        env:
          VV_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VV_VERSION_CODE: ${{ github.run_number }}
        run: |
          case "$GITHUB_REF_NAME" in android-v*) export VV_VERSION_NAME="${GITHUB_REF_NAME#android-v}";; *) export VV_VERSION_NAME="0.0.$GITHUB_RUN_NUMBER-dev";; esac
          echo "VV_VER=$VV_VERSION_NAME" >> "$GITHUB_ENV"
          gradle -p android assembleRelease --no-daemon --stacktrace
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/vibe-visualizer-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-visualizer-android
          path: out/vibe-visualizer-android.apk
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          python3 .github/release-notes.py android-v "$GITHUB_REF_NAME" "Vibe Visualizer on your Android phone or tablet (Android 8 or newer). It opens your Vibe Visualizer server (keep Tailscale connected on the phone) and has Vibe Bridge built in: the bars follow what the phone plays, the Spotify app included. Download the APK on the phone and open it; it installs over the version you have. See the README's \"Android app\" section." android web server > notes.md
          cat notes.md
      - if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vibe Visualizer for Android ${{ env.VV_VER }}${{ startsWith(github.ref_name, 'android-v0.') && ' beta' || '' }}
          prerelease: ${{ startsWith(github.ref_name, 'android-v0.') }}   # below 1.0 the app is a beta
          make_latest: false   # "Latest" stays with Vibe Bridge, which most people need first
          body_path: notes.md
          files: out/vibe-visualizer-android.apk
