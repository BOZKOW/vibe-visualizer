# Builds the Windows app (windows/) as one .exe on every change, and publishes it on the Releases page when a tag like
# windows-v0.1.0 is pushed. Can also be started by hand from the Actions tab.
name: Build Windows app
on:
  push:
    tags: ["windows-v*"]
    branches: [main]
    paths: ["windows/**", ".github/workflows/build-windows-app.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/build-windows-app.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the history since the last app release, for its notes
      - name: Version
        shell: bash
        run: |
          # the app tells the page its version (Settings → Help & about), so it can say when a new one is out
          case "$GITHUB_REF_NAME" in windows-v*) V="${GITHUB_REF_NAME#windows-v}";; *) V="0.0.$GITHUB_RUN_NUMBER-dev";; esac
          echo "VV_VER=$V" >> "$GITHUB_ENV"
          echo "VV_NUM=${V%%-*}" >> "$GITHUB_ENV"
      - name: Build app
        shell: bash
        run: |
          dotnet build windows/VibeVisualizer.csproj -c Release -o windows/build \
            -p:Version="$VV_VER" -p:AssemblyVersion="$VV_NUM.0" -p:FileVersion="$VV_NUM.0"
          mkdir -p windows/out
          cp windows/build/VibeVisualizer.exe windows/out/Vibe-Visualizer-Windows.exe
          ls -l windows/out
      - uses: actions/upload-artifact@v4
        with:
          name: Vibe-Visualizer-Windows
          path: windows/out/Vibe-Visualizer-Windows.exe
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        run: |
          python .github/release-notes.py windows-v "$GITHUB_REF_NAME" "Vibe Visualizer as a Windows app (Windows 10 or 11): your Vibe Visualizer server in its own window. Keep Tailscale connected on the PC. Download Vibe-Visualizer-Windows.exe and run it; to update, replace it with the new one. The app isn't signed yet, so the first time Windows may say it protected your PC: choose More info, then Run anyway. See the README's \"Windows app\" section." windows .github/workflows/build-windows-app.yml > notes.md
          cat notes.md
      - if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vibe Visualizer for Windows ${{ env.VV_VER }}${{ startsWith(github.ref_name, 'windows-v0.') && ' beta' || '' }}
          prerelease: ${{ startsWith(github.ref_name, 'windows-v0.') }}   # below 1.0 the app is a beta
          make_latest: false
          body_path: notes.md
          files: windows/out/Vibe-Visualizer-Windows.exe
