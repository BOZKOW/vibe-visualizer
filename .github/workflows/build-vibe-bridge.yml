# Builds Vibe Bridge as a single program for Windows and Linux, and publishes it on the Releases page
# when a tag like bridge-v1.0.0 is pushed. Can also be started by hand from the Actions tab.
name: Build Vibe Bridge
on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            out: vibe-bridge-windows.exe
          - os: ubuntu-22.04          # older glibc, so the Linux build runs on most distributions
            out: vibe-bridge-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r bridge/requirements.txt pyinstaller
      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --name vibe-bridge --collect-all soundcard bridge/vibe_bridge.py
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/vibe-bridge.exe "dist/${{ matrix.out }}"; else mv dist/vibe-bridge "dist/${{ matrix.out }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Vibe Bridge ${{ github.ref_name }}
          body: |
            Vibe Bridge lets Vibe Visualizer's bars follow everything your computer plays, the Spotify app included.
            Download the program for your system, run it, and open Vibe Visualizer on the same computer.
            See the README's "Vibe Bridge" section for details and starting it automatically.
          files: out/*
