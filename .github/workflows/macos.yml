# Builds the macOS app (macos/) as a drag-to-Applications .dmg on every change, and publishes it on the Releases page
# when a tag like macos-v0.1.0 is pushed. Can also be started by hand from the Actions tab.
name: Build macOS app
on:
  push:
    tags: ["macos-v*"]
    branches: [main]
    paths: ["macos/**", "web/index.html", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "web/index.html", ".github/workflows/macos.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the history since the last app release, for its notes
      - name: Version
        run: |
          # the app tells the page its version (Settings → Help & about), so it can say when a new one is out
          case "$GITHUB_REF_NAME" in macos-v*) V="${GITHUB_REF_NAME#macos-v}";; *) V="0.0.$GITHUB_RUN_NUMBER-dev";; esac
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" macos/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" macos/Info.plist
          echo "VV_VER=$V" >> "$GITHUB_ENV"
      - name: Build app
        run: |
          xcodebuild \
            -project macos/VibeVisualizer.xcodeproj \
            -scheme VibeVisualizer \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath macos/build \
            CODE_SIGNING_ALLOWED=NO
          bash macos/package-dmg.sh \
            "macos/build/Build/Products/Release/Vibe Visualizer.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Vibe-Visualizer-macOS
          path: macos/out/Vibe-Visualizer-macOS.dmg
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/macos-v')
        run: |
          python3 .github/release-notes.py macos-v "$GITHUB_REF_NAME" "Vibe Visualizer as a Mac app (macOS 13 or newer): your Vibe Visualizer server in its own window. Keep Tailscale connected on the Mac. Open the .dmg and drag Vibe Visualizer to Applications; it replaces the version you have. The app isn't signed by Apple yet, so the first time, right-click it and choose Open. See the README's \"macOS app\" section." macos web server > notes.md
          cat notes.md
      - if: startsWith(github.ref, 'refs/tags/macos-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vibe Visualizer for macOS ${{ env.VV_VER }}${{ startsWith(github.ref_name, 'macos-v0.') && ' beta' || '' }}
          prerelease: ${{ startsWith(github.ref_name, 'macos-v0.') }}   # below 1.0 the app is a beta
          make_latest: false
          body_path: notes.md
          files: macos/out/Vibe-Visualizer-macOS.dmg
